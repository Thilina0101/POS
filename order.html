<!DOCTYPE html>
<html lang="th" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Menu · Order</title>
<style>
  :root{--bg:#f6f4ef;--panel:#fff;--ink:#1f2328;--muted:#6b7280;--line:#e6e2d9;--brand:#0f766e;--brand-soft:#e6f4f2;--danger:#c0392b;--ok:#15803d}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;padding-bottom:96px}
  button{font:inherit;cursor:pointer}
  .top{background:var(--brand);color:#fff;padding:18px 16px 14px}
  .top h1{margin:0;font-size:19px;line-height:1.3}
  .chip{display:inline-block;margin-top:8px;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
  .cats{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
  .cats button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;white-space:nowrap}
  .cats button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{padding:8px 16px}
  h2{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
  .it{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px}
  .it .info{flex:1;min-width:0}
  .it .n{font-weight:600}
  .it .p{color:var(--brand);font-weight:700;margin-top:3px}
  .it.out{opacity:.5}
  .it .ph{width:92px;height:92px;flex:none;border-radius:12px;object-fit:cover;background:#eee;cursor:zoom-in}
  .it .ph0{display:flex;align-items:center;justify-content:center;font-size:36px;cursor:default;background:#f1ede4}
  .it .d{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .it .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .zoom{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff;text-align:center}
  .zoom img{max-width:100%;max-height:70vh;border-radius:14px}
  .zoom .zn{font-size:19px;font-weight:700;margin-top:14px}
  .ln .tn{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:#eee}
  .add{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700;line-height:1}
  .qty b{min-width:20px;text-align:center}
  .sold{font-size:13px;color:var(--danger);font-weight:700}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
  .bar button,.big{width:100%;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
  .big{justify-content:center}
  .big:disabled{opacity:.6}
  .sheet{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
  .sheet .box{background:var(--panel);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
  .x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted)}
  .ln{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .ln .info{flex:1}
  label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
  input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .tot{display:flex;justify-content:space-between;font-size:19px;font-weight:800;margin:14px 0 4px}
  .hint{font-size:13px;color:var(--muted)}
  .msg{padding:40px 24px;text-align:center;color:var(--muted)}
  .done{padding:28px 18px;text-align:center}
  .done .big-ic{font-size:56px}
  .status{margin:18px 0;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:600}
  .status.ok{border-color:#86efac;background:#f0fdf4;color:var(--ok)}
  .status.bad{border-color:#fca5a5;background:#fef2f2;color:var(--danger)}
  .sum{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0}
  .sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
</style>
</head>
<body>
<header class="top">
  <h1 id="shop">Menu</h1>
  <span class="chip" id="tableChip" hidden></span>
</header>
<nav class="cats" id="cats" hidden></nav>
<main id="list"><div class="msg">กำลังโหลดเมนู… / Loading menu…</div></main>

<div class="bar" id="bar" hidden>
  <button id="openCart"><span>🛒 <span id="barCount"></span> · ดูรายการ / View order</span><b id="barTotal"></b></button>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="box">
    <h3>รายการที่สั่ง / Your order <button class="x" id="closeCart" aria-label="Close">×</button></h3>
    <div id="lines"></div>
    <div class="tot"><span>ยอดรวม / Total</span><span id="sheetTotal"></span></div>
    <div class="hint" id="feeHint"></div>
    <label for="cName">ชื่อ / Name (optional)</label>
    <input id="cName" maxlength="60" autocomplete="name">
    <label for="cNote">หมายเหตุ / Note (optional)</label>
    <textarea id="cNote" rows="2" maxlength="200" placeholder="เช่น ไม่เผ็ด / e.g. less spicy"></textarea>
    <div style="height:14px"></div>
    <button class="big" id="send">ส่งคำสั่งซื้อ / Send order</button>
  </div>
</div>

<div class="zoom" id="zoom" hidden><img id="zoomImg" alt=""><div class="zn" id="zoomName"></div><div class="hint" style="color:#ddd;margin-top:6px">แตะเพื่อปิด / Tap to close</div></div>

<section class="done" id="done" hidden>
  <div class="big-ic">✅</div>
  <h2 style="text-transform:none;color:var(--ink);font-size:21px">ส่งออร์เดอร์แล้ว / Order sent</h2>
  <div class="hint" id="doneId"></div>
  <div class="status" id="status"></div>
  <div class="sum" id="doneSum"></div>
  <button class="big sec" id="more">➕ สั่งเพิ่ม / Order more</button>
</section>

<script>
const P = new URLSearchParams(location.search);
const SID = P.get('s') || '';
const TABLE = (P.get('t') || '').slice(0, 20);
const API = /^[\w-]{20,}$/.test(SID) ? `https://script.google.com/macros/s/${SID}/exec` : null;

let shop = {}, items = [], cart = {}, activeCat = null, pollTimer = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (shop.currency || '฿') + ' ' + Number(n || 0).toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
const tableText = t => /^\d+$/.test(t) ? `โต๊ะ ${t} · Table ${t}` : /takeaway/i.test(t) ? 'กลับบ้าน · Takeaway' : t;

function fail(msg){ $('list').innerHTML = `<div class="msg">${msg}</div>`; }

async function load(){
  if(TABLE){ $('tableChip').textContent = tableText(TABLE); $('tableChip').hidden = false; }
  if(!API) return fail('กรุณาสแกน QR code ที่โต๊ะ<br>Please scan the QR code on your table.');
  try{
    const r = await fetch(API + '?action=menu');
    const j = await r.json();
    if(!j.ok) throw new Error(j.error);
    shop = j.shop || {};
    items = j.items || [];
    if(shop.name){ $('shop').textContent = shop.name; document.title = shop.name + ' · Menu'; }
    if(!items.length) return fail('ยังไม่มีเมนู กรุณาติดต่อพนักงาน<br>The menu isn\'t available yet. Please ask our staff.');
    const fees = [];
    if(shop.servicePct) fees.push(`service charge ${shop.servicePct}%`);
    if(shop.taxPct) fees.push(`tax ${shop.taxPct}%`);
    $('feeHint').textContent = fees.length ? `+ ${fees.join(' + ')} when paying` : '';
    render();
  }catch(e){
    fail('โหลดเมนูไม่ได้ กรุณาลองใหม่<br>Could not load the menu. Please check your internet and try again.<br><br><button class="add" onclick="location.reload()">ลองใหม่ / Retry</button>');
  }
}

function cats(){ return [...new Set(items.map(i => i.category || 'Other'))]; }

// Google Drive photos: try a second link format if the first one doesn't load
function imgFallback(el){
  const m = el.src.match(/drive\.google\.com\/thumbnail\?id=([^&]+)/);
  if(m && !el.dataset.fb){ el.dataset.fb = '1'; el.src = 'https://lh3.googleusercontent.com/d/'+m[1]+'=w600'; }
  else { el.removeAttribute('src'); el.style.cursor = 'default'; }
}

function render(){
  const cs = cats();
  const anyImg = items.some(i => i.image);
  $('cats').hidden = cs.length < 2;
  $('cats').innerHTML = cs.map(c => `<button data-c="${esc(c)}" class="${c===activeCat?'active':''}">${esc(c)}</button>`).join('');
  $('cats').querySelectorAll('button').forEach(b => b.onclick = () => {
    activeCat = b.dataset.c;
    document.getElementById('cat-' + cs.indexOf(activeCat))?.scrollIntoView({behavior:'smooth', block:'start'});
    $('cats').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
  });
  $('list').innerHTML = cs.map((c, ci) => `<h2 id="cat-${ci}" style="scroll-margin-top:60px">${esc(c)}</h2>` +
    items.map((it, i) => ({it, i})).filter(x => (x.it.category || 'Other') === c).map(({it, i}) => {
      const q = cart[i] || 0;
      const ctl = !it.available ? '<span class="sold">หมด / Sold out</span>'
        : q ? `<div class="qty"><button data-i="${i}" data-d="-1" aria-label="Less">−</button><b>${q}</b><button data-i="${i}" data-d="1" aria-label="More">+</button></div>`
        : `<button class="add" data-i="${i}" data-d="1">+ เพิ่ม</button>`;
      const ph = it.image ? `<img class="ph" src="${esc(it.image)}" alt="${esc(it.name)}" loading="lazy" data-z="${i}" onerror="imgFallback(this)">`
        : anyImg ? '<div class="ph ph0">🍛</div>' : '';
      return `<div class="it ${it.available?'':'out'}">${ph}<div class="info"><div class="n">${esc(it.name)}</div>${it.description?`<div class="d">${esc(it.description)}</div>`:''}<div class="p">${money(it.price)}</div></div><div class="right">${ctl}</div></div>`;
    }).join('')).join('');
  $('list').querySelectorAll('[data-i]').forEach(b => b.onclick = () => change(+b.dataset.i, +b.dataset.d));
  $('list').querySelectorAll('[data-z]').forEach(im => im.onclick = () => {
    if(!im.getAttribute('src')) return;
    $('zoomImg').src = im.src.replace(/sz=w\d+/, 'sz=w1200').replace(/=w600$/, '=w1200');
    $('zoomName').textContent = items[im.dataset.z].name + ' · ' + money(items[im.dataset.z].price);
    $('zoom').hidden = false;
  });
  renderBar();
}

function change(i, d){
  cart[i] = Math.max(0, Math.min(50, (cart[i] || 0) + d));
  if(!cart[i]) delete cart[i];
  render();
  if(!$('sheet').hidden) renderSheet();
}

function totals(){
  let count = 0, total = 0;
  for(const [i, q] of Object.entries(cart)){ count += q; total += items[i].price * q; }
  return {count, total};
}

function renderBar(){
  const {count, total} = totals();
  $('bar').hidden = !count || !$('done').hidden;
  $('barCount').textContent = count;
  $('barTotal').textContent = money(total);
}

function renderSheet(){
  const ids = Object.keys(cart);
  if(!ids.length){ $('sheet').hidden = true; return; }
  $('lines').innerHTML = ids.map(i => `<div class="ln">${items[i].image?`<img class="tn" src="${esc(items[i].image)}" alt="" onerror="imgFallback(this)">`:''}<div class="info"><div>${esc(items[i].name)}</div><div class="hint">${money(items[i].price)}</div></div>
    <div class="qty"><button data-i="${i}" data-d="-1">−</button><b>${cart[i]}</b><button data-i="${i}" data-d="1">+</button></div></div>`).join('');
  $('lines').querySelectorAll('[data-i]').forEach(b => b.onclick = () => change(+b.dataset.i, +b.dataset.d));
  $('sheetTotal').textContent = money(totals().total);
}

$('zoom').onclick = () => { $('zoom').hidden = true; $('zoomImg').removeAttribute('src'); };
$('openCart').onclick =() => { $('sheet').hidden = false; renderSheet(); };
$('closeCart').onclick = () => $('sheet').hidden = true;
$('sheet').onclick = e => { if(e.target === $('sheet')) $('sheet').hidden = true; };

$('send').onclick = async () => {
  const btn = $('send');
  btn.disabled = true; btn.textContent = 'กำลังส่ง… / Sending…';
  const lines = Object.entries(cart).map(([i, q]) => ({name: items[i].name, qty: q}));
  try{
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'placeOrder', table: TABLE, customer: $('cName').value.trim(), note: $('cNote').value.trim(), items: lines})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error);
    showDone(j.id, lines, j.subtotal);
  }catch(e){
    alert('ส่งไม่สำเร็จ กรุณาลองใหม่ หรือแจ้งพนักงาน\nCould not send your order. Please try again or ask our staff.\n\n' + e.message);
  }finally{
    btn.disabled = false; btn.textContent = 'ส่งคำสั่งซื้อ / Send order';
  }
};

function showDone(id, lines, subtotal){
  cart = {};
  $('cNote').value = '';
  $('sheet').hidden = true;
  ['list','cats','bar'].forEach(x => $(x).hidden = true);
  $('done').hidden = false;
  $('doneId').textContent = 'Order no. ' + id;
  $('doneSum').innerHTML = lines.map(l => `${l.qty} × ${esc(l.name)}`).join('<br>') + `<br><b>${money(subtotal)}</b>`;
  setStatus('NEW');
  clearInterval(pollTimer);
  const started = Date.now();
  pollTimer = setInterval(async () => {
    if(Date.now() - started > 45*60*1000) return clearInterval(pollTimer);
    try{
      const j = await (await fetch(API + '?action=status&id=' + encodeURIComponent(id))).json();
      if(j.ok) setStatus(j.status);
      if(['REJECTED','PAID'].includes(j.status)) clearInterval(pollTimer);
    }catch(e){}
  }, 8000);
  window.scrollTo(0, 0);
}

function setStatus(s){
  const map = {
    NEW: ['⏳ รอร้านยืนยัน<br><span class="hint">Waiting for the restaurant to confirm…</span>', ''],
    ACCEPTED: ['👨‍🍳 ร้านรับออร์เดอร์แล้ว กำลังเตรียมอาหาร<br><span class="hint">Accepted — your food is being prepared</span>', 'ok'],
    REJECTED: ['❌ ร้านไม่สามารถรับออร์เดอร์นี้ได้ กรุณาติดต่อพนักงาน<br><span class="hint">The restaurant couldn\'t accept this order. Please ask our staff.</span>', 'bad'],
    PAID: ['✅ ชำระเงินแล้ว ขอบคุณ<br><span class="hint">Paid — thank you!</span>', 'ok']
  };
  const [html, cls] = map[s] || map.NEW;
  $('status').innerHTML = html;
  $('status').className = 'status ' + cls;
}

$('more').onclick = () => {
  clearInterval(pollTimer);
  $('done').hidden = true;
  $('list').hidden = false;
  render();
};

load();
</script>
</body>
</html>
